name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProductServiceApi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore ProductServiceApi.sln
      - run: dotnet build ProductServiceApi.sln --configuration Release --no-restore
      - run: dotnet test ProductServiceApi.sln --configuration Release --no-build
